aid: headsup
name: HeadsUp
description: >-
  HeadsUp was an AI conversion engine for product-led growth (PLG) that helped go-to-market
  teams identify which product-qualified users to engage and when to engage them. It ingested
  product usage and analytics data (for example from Segment), applied feature engineering and
  machine-learning scoring to surface conversion, churn, and upsell signals, and synced those
  insights into sales tooling such as Salesforce so reps could act on in-product behavior without
  engineering, code, or SQL. Customers included Contentful, Dialpad, and Matillion. HeadsUp was
  backed by Wing Venture Capital and 645 Ventures and was acquired by composable-CDP company
  Hightouch in November 2023, after which its team joined Hightouch to work on Customer 360. The
  standalone headsup.ai product and developer surface have since been wound down; this profile is
  retained as an acquired-company record in the API Evangelist network.
